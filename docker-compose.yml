version: '3.8'

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: '0.5GB'
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/contagem-pessoas"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '1.3'
          memory: '2.5GB'
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    driver: bridge

